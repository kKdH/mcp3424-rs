[package]
name = "mcp3424-stm32g4-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mcp3424 = { path = "../..", default-features = false, features = ["defmt", "uom", "stream"] }

cortex-m = { version = "0.7.*", features = ["critical-section-single-core", "inline-asm"]}
cortex-m-rt = { version = "0.7.*" }
defmt = { version = "1.0.*" }
defmt-rtt = { version = "1.1.*" }
embassy-executor = { version = "0.9.*", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.*" }
embassy-stm32 = { version = "0.4.*", features =  ["stm32g431kb", "defmt", "time-driver-any", "memory-x", "unstable-pac", "exti"]}
embassy-sync = { version = "0.7.*", features = ["defmt"] }
embassy-time = { version = "0.5.*", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embedded-alloc = { version = "0.6.*" }
embedded-hal-async = "1.0.*"
futures = { version = "0.3.*", default-features = false }
panic-probe = { version = "1.0.*" }
uom = { version = "0.37.*", default-features = false, features = ["si"] }

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "574868282518ceb81bddcb03bee38fc5b6208a5a" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "574868282518ceb81bddcb03bee38fc5b6208a5a" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "574868282518ceb81bddcb03bee38fc5b6208a5a" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "574868282518ceb81bddcb03bee38fc5b6208a5a" }
